<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2435">
  <title>Operação Interna — Santuário Gestão</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/tesouraria.css">
</head>
<body class="treasury-panel-page internal-workspace-page">
  <header class="treasury-panel-header">
    <div class="treasury-panel-brand"><div class="brand-emblem small"><span></span></div><div><strong id="workspaceChurchName">Santuário Gestão</strong><small>Operação da Tesouraria Interna</small></div></div>
    <div class="treasury-panel-actions"><button id="workspaceThemeBtn" class="treasury-round-button" type="button">◐</button><button id="workspaceBackBtn" class="treasury-outline-button" type="button">← Voltar à Tesouraria</button><button id="workspaceExitBtn" class="treasury-danger-button" type="button">Encerrar sessão</button></div>
  </header>

  <main class="treasury-panel-shell internal-workspace-shell">
    <section id="workspaceHero" class="internal-workspace-hero"></section>
    <nav id="workflowSteps" class="internal-workflow-steps" aria-label="Etapas da tesouraria"></nav>
    <section id="workspaceMetrics" class="treasury-metrics internal-workspace-metrics"></section>

    <div class="internal-workspace-layout">
      <section class="internal-workspace-main">
        <article id="receiptPanel" class="internal-workspace-panel"></article>
        <article id="cashPanel" class="internal-workspace-panel"></article>
        <article id="classificationPanel" class="internal-workspace-panel"></article>
        <article id="destinationPanel" class="internal-workspace-panel"></article>
        <article id="approvalPanel" class="internal-workspace-panel"></article>
      </section>
      <aside id="workspaceSummary" class="internal-workspace-summary"></aside>
    </div>
  </main>

  <div id="treasuryModalBackdrop" class="treasury-modal-backdrop" hidden><div class="treasury-modal wide" role="dialog" aria-modal="true"><header><div><span id="treasuryModalKicker" class="treasury-kicker dark"></span><h2 id="treasuryModalTitle"></h2><p id="treasuryModalSubtitle"></p></div><button id="closeTreasuryModal" type="button">×</button></header><div id="treasuryModalBody"></div></div></div>
  <div id="treasuryToastRegion" class="treasury-toast-region" aria-live="polite"></div>

  <script src="assets/js/web-sync.js?v=15300"></script><script src="assets/js/data.js"></script><script src="assets/js/currency-mask.js?v=4102"></script><script src="assets/js/form-fields.js?v=4102"></script>
  <script src="assets/js/treasury-common.js?v=15300"></script>
  <script src="assets/js/treasury-internal-operation.js"></script>
</body>
</html>
