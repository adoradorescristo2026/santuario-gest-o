<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2435">
  <title>Tesouraria Interna — Santuário Gestão</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/tesouraria.css">
</head>
<body class="treasury-panel-page internal-treasury-page">
  <header class="treasury-panel-header">
    <div class="treasury-panel-brand"><div class="brand-emblem small"><span></span></div><div><strong id="internalChurchName">Santuário Gestão</strong><small>Tesouraria Interna</small></div></div>
    <div class="treasury-panel-actions"><button id="internalThemeBtn" class="treasury-round-button" type="button">◐</button><button id="operationChoiceBtn" class="treasury-outline-button" type="button">Tipos de operação</button><button id="internalExitBtn" class="treasury-danger-button" type="button">Encerrar sessão</button></div>
  </header>

  <main class="treasury-panel-shell">
    <section class="treasury-session-strip compact-session-strip"><span class="session-live-dot"></span><div><small>OPERADOR</small><strong id="internalOperator">—</strong></div><div><small>OPERAÇÃO</small><strong>Tesouraria Interna</strong></div><div><small>ENTRADA</small><strong id="internalSessionAt">—</strong></div></section>

    <section class="treasury-panel-hero internal-hero"><div><span class="treasury-kicker">CULTOS E CONTRIBUIÇÕES</span><h1>Tesouraria Interna</h1></div><button id="newInternalTreasuryBtn" class="treasury-hero-primary" type="button">+ NOVA TESOURARIA</button></section>

    <section id="internalMetrics" class="treasury-metrics"></section>

    <section class="treasury-operations-section"><div class="treasury-section-head"><div><span class="treasury-kicker dark">EM CONFERÊNCIA</span><h2>Operações em andamento</h2></div><span id="internalOpenCount" class="treasury-count-badge">0</span></div><div id="internalOpenList" class="treasury-operation-list"></div></section>

    <section class="treasury-history-section"><div class="treasury-section-head"><div><span class="treasury-kicker dark">HISTÓRICO</span><h2>Tesourarias concluídas</h2></div></div><div id="internalHistory" class="treasury-history-table-wrap"></div></section>
  </main>

  <div id="treasuryModalBackdrop" class="treasury-modal-backdrop" hidden><div class="treasury-modal" role="dialog" aria-modal="true"><header><div><span id="treasuryModalKicker" class="treasury-kicker dark"></span><h2 id="treasuryModalTitle"></h2><p id="treasuryModalSubtitle"></p></div><button id="closeTreasuryModal" type="button">×</button></header><div id="treasuryModalBody"></div></div></div>
  <div id="treasuryToastRegion" class="treasury-toast-region" aria-live="polite"></div>

  <script src="assets/js/web-sync.js?v=15300"></script><script src="assets/js/data.js"></script><script src="assets/js/currency-mask.js?v=4102"></script><script src="assets/js/form-fields.js?v=4102"></script><script src="assets/js/treasury-common.js?v=15300"></script><script src="assets/js/treasury-internal.js"></script>
</body>
</html>
